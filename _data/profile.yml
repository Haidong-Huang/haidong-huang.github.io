short_bio: >-
  <h6>About Me</h6>
  <p>
    Hi, I'm Haidong <span role="img" aria-label="waving hand">👋</span>!
    You can call me Andrew. I love robots and am dedicated to integrating them safely and reliably into our lives.
  </p>
  <p>
    I am a second-year undergraduate at the
    <a href="https://www.nottingham.ac.uk/" target="_blank" rel="noopener noreferrer">University of Nottingham</a>,
    pursuing a Bachelor of Engineering (Honours) degree.
    I am currently a visiting student in the
    <a href="https://www.polyu.edu.hk/fcms/" target="_blank" rel="noopener noreferrer">Faculty of Computer and Mathematical Sciences</a>
    at The Hong Kong Polytechnic University, advised by
    <a href="https://www.polyu.edu.hk/comp/people/academic-staff/prof-yang-chenguang-charlie/" target="_blank" rel="noopener noreferrer">Prof. Chenguang (Charlie) Yang</a>
    (Fellow of IEEE/IET; Member of
    <a href="https://euro-acad.eu/" target="_blank" rel="noopener noreferrer">EASA</a> and
    <a href="https://thenaai.org/" target="_blank" rel="noopener noreferrer">NAAI</a>).
  </p>
  <p>
    I also spent a wonderful summer at
    <a href="https://hkust.edu.hk/" target="_blank" rel="noopener noreferrer">The Hong Kong University of Science and Technology</a>'s
    <a href="https://ri.hkust.edu.hk/" target="_blank" rel="noopener noreferrer">Cheng Kar-Shun Robotics Institute</a>,
    under the supervision of
    <a href="https://personal.hkust-gz.edu.cn/junma/people-page.html" target="_blank" rel="noopener noreferrer">Prof. Jun Ma</a>.
    I am also an Undergraduate Researcher in the
    <a href="https://sites.google.com/view/xiaocong-li/open-positions" target="_blank" rel="noopener noreferrer">Robot Learning and Control Lab</a>
    at
    <a href="https://www.eitech.edu.cn/" target="_blank" rel="noopener noreferrer">Eastern Institute of Technology, Ningbo</a>,
    advised by
    <a href="https://sites.google.com/view/xiaocong-li/about" target="_blank" rel="noopener noreferrer">Prof. Xiaocong Li</a>,
    and work closely with
    <a href="https://h-y-zhu.github.io/" target="_blank" rel="noopener noreferrer">Dr. Haiyue Zhu</a>
    from <a href="https://www.a-star.edu.sg/" target="_blank" rel="noopener noreferrer">A*STAR</a>.
  </p>
  <h6>Research Interests</h6>
  <p>
    My research interests lie at the intersection of
    <strong>robotic manipulation, generative models, and control theory</strong>,
    with a primary focus on <strong>dexterous manipulation and generative control policies</strong>.
    I am interested in how an understanding of geometric structure, contact interactions,
    and action consequences can inform policy learning and closed-loop control,
    enabling robots to adapt to changing environments, flexibly compose manipulation skills,
    and reliably accomplish long-horizon tasks.
    My long-term goal is to enable
    <strong>robust, safe, and sustained robot deployment at scale in real-world environments</strong>
    and to build
    <strong>intelligent systems that perceive, reason about, and interact with the physical world</strong>.
    More broadly, I am drawn to research that combines
    <strong>scientific impact with the potential to inspire new ideas</strong>.
  </p>

