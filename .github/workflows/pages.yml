name: Build and deploy homepage

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check Jekyll site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check pages, images and internal links
        run: python3 tools/check_site.py _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    # Review branches only build. Rename the repository before the first release.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.name == 'haidong-huang.github.io'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

