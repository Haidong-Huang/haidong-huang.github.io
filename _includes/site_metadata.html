<meta name="description" content="{{ site.description | escape }}">
<meta name="author" content="{{ site.data.profile.primary_name | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | escape }} | {{ site.title | escape }}">
<meta property="og:description" content="{{ site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.data.profile.portrait_url | absolute_url }}">
<meta property="og:image:alt" content="{{ site.data.profile.primary_name | escape }}">
<meta name="twitter:card" content="summary">
