# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
url: "https://haidong-huang.github.io"
baseurl: "" # Personal site: repository must be named haidong-huang.github.io.
repository: "Haidong-Huang/haidong-huang.github.io"
title: "Haidong (Andrew) Huang"
description: "Haidong (Andrew) Huang's academic homepage: Physical AI, robotics, dexterous manipulation, generative models, and control."

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
plugins:
  - jekyll-email-protect

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Keep unused template demos and maintenance notes out of the public site.
exclude:
  - README.md
  - CONTENT_NOTES.md
  - DEPLOYMENT.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - release
  - _showcase
  - showcase.html
  - blogs.html
  - tools
  - preview.cmd
  - .preview-tools
  - .preview-browser
  - _preview
  - assets/images/incoming
  - assets/images/etc
  - assets/images/photos/portrait.jpg
  - assets/images/covers/APEX.png
  - assets/images/covers/DEMO.png
  - assets/images/covers/Flexible.png
  - assets/images/covers/PhysLogic.png
  - assets/images/covers/SPECS.png
  - assets/images/badges/CAS_logo.png
  - assets/images/badges/CASIA-logo.jpg
  - assets/images/badges/meituan_logo.png
  - assets/images/badges/MIT_Social_circle.png
  - assets/images/badges/page_logo.png
  - assets/images/badges/PKU_red.png
  - assets/images/badges/tencent_logo.png
  - assets/images/badges/UESTC_logo.png
  - assets/images/badges/wenge_logo.png

timezone: Asia/Shanghai

collections:
  publications:
    output: false
  blogs:
    output: true
    permalink: /posts/:year/:month/:title/
  news:
    output: false
  showcase:
    output: false
